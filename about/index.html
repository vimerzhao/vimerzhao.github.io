<script>
	(function () {
		var toggle = document.querySelector('[data-gallery-toggle="book-gallery"]');
		var gallery = document.getElementById('book-gallery');
		var icon = toggle && toggle.querySelector('.business-card__toggle-icon');
		var label = toggle && toggle.querySelector('.business-card__toggle-label');

		if (!toggle || !gallery || !icon || !label) {
			return;
		}

		toggle.addEventListener('click', function () {
			var expanded = !gallery.hidden;

			if (expanded) {
				gallery.hidden = true;
				icon.textContent = '▸';
				label.textContent = '点击展开更多';
				toggle.setAttribute('aria-expanded', 'false');
				return;
			}

			gallery.hidden = false;
			gallery.querySelectorAll('img[data-src]').forEach(function (image) {
				image.src = image.dataset.src;
				image.removeAttribute('data-src');
			});
			icon.textContent = '▾';
			label.textContent = '点击收起';
			toggle.setAttribute('aria-expanded', 'true');
		});
	})();
</script>
